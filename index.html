<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Malek Al Baraa | Personal Brand</title>
<meta name="description" content="Malek Al Baraa - Entrepreneur and Personal Brand. Building influence and strong digital presence.">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0a0f2c, #020617);
    color: white;
    text-align: center;
}

/* الكونتينر */
.container {
    padding: 50px 20px;
}

/* الصورة */
.profile-img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    object-position: center 15%; /* أهم سطر لعدم قص الراس */
    border-radius: 20px;
    border: 3px solid #FFD700;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    transition: 0.3s;
}

.profile-img:hover {
    transform: scale(1.05);
}

/* الاسم */
h1 {
    color: #FFD700;
    margin-top: 20px;
    font-size: 40px;
}

/* العنوان */
.subtitle {
    color: #ccc;
    font-size: 18px;
    margin-bottom: 20px;
}

/* الوصف */
.description {
    max-width: 600px;
    margin: auto;
    line-height: 1.6;
    color: #aaa;
}

/* الأزرار */
.buttons {
    margin-top: 30px;
}

.btn {
    display: inline-block;
    margin: 10px;
    padding: 12px 25px;
    border: 2px solid #FFD700;
    color: #FFD700;
    border-radius: 30px;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: #FFD700;
    color: black;
}

/* الفوتر */
footer {
    margin-top: 60px;
    color: #666;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="container">

    <!-- الصورة -->
    <img src="Profile.jpg" alt="Malek Al Baraa" class="profile-img">

    <!-- الاسم -->
    <h1>Malek Al Baraa</h1>

    <!-- التخصص -->
    <div class="subtitle">Entrepreneur | Personal Brand</div>

    <!-- الوصف -->
    <p class="description">
        Building a strong presence in business, digital space, and personal branding.
        Focused on growth, influence, and creating high-level opportunities.
    </p>

    <!-- الأزرار -->
    <div class="buttons">
        <a href="https://instagram.com/malekalbara_" class="btn" target="_blank">Instagram</a>
        <a href="https://www.linkedin.com/in/malekalbaraa" class="btn" target="_blank">LinkedIn</a>
    </div>

</div>

<footer>
    © 2025 Malek Al Baraa. All rights reserved.
</footer>

</body>
</html>
